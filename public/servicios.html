<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Servicios - Mi Empresa</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header" id="site-header">
    <div class="container">
      <div class="logo"><a href="/"><img src="/img/logo.png" alt="Logo" /></a></div>
      <nav class="nav">
        <a href="/">Inicio</a>
        <a href="/nosotros.html">Nosotros</a>
        <a href="/servicios.html">Nuestros Servicios</a>
        <a href="/clientes.html">Catálogo de Clientes</a>
        <a href="/contacto.html">Contáctenos</a>
      </nav>
    </div>
  </header>

  <main style="padding-top: 100px;">
    <section class="section">
      <div class="container">
        <h2>Nuestros Servicios</h2>
        <ul>
          <li>Servicio 1 - Descripción breve.</li>
          <li>Servicio 2 - Descripción breve.</li>
          <li>Servicio 3 - Descripción breve.</li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Mi Empresa.</p>
  </footer>

  <script>
    (function() {
      const header = document.getElementById('site-header');
      const onScroll = () => { if (window.scrollY > 20) header.classList.add('scrolled'); else header.classList.remove('scrolled'); };
      window.addEventListener('scroll', onScroll);
      onScroll();
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
